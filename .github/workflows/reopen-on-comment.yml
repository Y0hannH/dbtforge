# Issues are closed when the fix is released, but a reporter cannot reopen an
# issue a maintainer closed. This reopens a completed issue when someone other
# than a maintainer comments on it, so follow-ups are not lost in a closed thread.
name: Reopen on follow-up comment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reopen:
    # Skipped on pull requests, on issues closed as "not planned" or duplicate,
    # and on comments from maintainers (e.g. a "Shipped in x.y.z" note).
    if: >-
      github.event.issue.state == 'closed' &&
      github.event.issue.pull_request == null &&
      github.event.issue.state_reason == 'completed' &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Reopen the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue reopen "$ISSUE_NUMBER" \
            --comment "Reopened automatically because of a follow-up comment. If this is a separate problem, please open a new issue and link back here."
